name: 📱 Mobile Appium Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_appium:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Verify APK Presence
        run: ls -l FinExtract.apk || echo "APK not found, skipping deep test"
