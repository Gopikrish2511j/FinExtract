name: FinExtract Enterprise CI

on:
  push:
    branches: [ main ]

jobs:
  selenium_tests:
    name: "🌐 E2E Selenium (300 Cases)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run 300 Tests
        run: python -m pytest tests/test_selenium_battery.py -v

  appium_tests:
    name: "📱 Mobile Appium Test"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Verify APK Presence
        run: ls -l FinExtract.apk || echo "APK not found, skipping deep test"

  security_scan:
    name: "🛡️ Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Security Scan
        run: bandit -r backend/ -ll

  load_tests:
    name: "⚡ Performance Load Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Locust
        run: pip install locust
      - name: Run Headless Load Test
        run: |
          cd backend && (python app.py &)
          sleep 5
          locust -f tests/load_test.py --headless -u 10 -r 2 --run-time 30s --host http://localhost:5000
